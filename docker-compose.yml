version: '3.8'

services:
  markaz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: koyyam_markaz_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=koyyam_markaz_production_secret_key_change_me
    volumes:
      # Persistent database and media uploads across container restarts
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
